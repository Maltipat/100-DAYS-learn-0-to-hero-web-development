<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Registeration</legend>
            <label for="usename">Name</label>
            <input id="usename" type="text" placeholder="usename" required/>
            <br/>
            <br/>
            <label for="email">Email</label>
            <input type="email" placeholder="Register email" />
            <br/>
            <br/>
            <label for="">Password</label>
            <input type="password"/>
            <br/>
            <br/>
            <label for="">Gender</label>
            <input type="radio" value="male" name="Gender"/>
            <label for="">Male</label>
            <input type="radio" value="female" name="Gender"/>
            <label for="">Female</label>
            <input type="radio" value="other" name="Gender"/>
            <label for="">Other</label>
            <br/>
            <br/>
            <label for="">Skills</label>
            <input type="checkbox" name="Skills" value="Html" checked/>
            <label for="">Html</label>
            <input type="checkbox" name="Skills" value="Css" checked/>
            <label for="">Css</label>
            <input type="checkbox" name="Skills" value="JavaScript" checked/>
            <label for="">JavaScript</label>
            <br/>
            <br/>
            <label for="">Qualification</label>
            <select name="" id="">
                <optgroup label="BCA">
                </optgroup>
            </select>
             <select name="" id="">
                <optgroup label="MCA">
                </optgroup>
            </select>
            <br/>
            <br/>
            <label for="">Resume</label>
            <input type="file"/>
            <br/>
            <br/>
            <label for="">Address</label>
            <textarea name="" rows="5" cols="20" id=""></textarea>
            <br/>
            <br/>
            <label for="">Experience</label>
            <input type="range" min="0" max="10" step="2" name="experience"/>
            <br/>
            <br/>
            <label for="">DOJ</label>
            <input type="date" min="2025-09-25" max="2025-10-03" />
            <br/>
            <br/>
            <button type="submit">submit</button>
        </fieldset>
    </form>
</body>
</html>
