<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #container{
            height: 400px;
            width: 450px;
            background-color: black;
            margin: auto;
            margin: 100px auto;
            border-radius: 35px;
            padding-top: 30px;
            padding-left: 40px;

        }
        #container > #star{
            height: 60px;
            width: 60px;
            background-color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container > #star > i{
            color: orangered;
            font-size: 22px;
        }
        
    </style>
</head>
<body>
    <div id="container">
        <div id="star">
            <i class=""></i>
        </div>
        <div>
              <h1 id="content_head">How did we do?</h1>
        </div>
    </div>
</body>
</html>
